[pytest]
# pytest configuration for the phishing detection project

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Display extra summary info
addopts = -v --tb=short --strict-markers

# Markers for organizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may require files)
    slow: Slow-running tests
    requires_model: Tests that require trained model files

# Coverage
# Run with: pytest --cov=src tests/
norecursedirs = .git .venv venv node_modules __pycache__ .pytest_cache
